- name: Tijara
  status: live
  label: Shari'ah Finance
  accent: blue
  short: "Screens stocks for Shari'ah compliance against AAOIFI standards."
  description: >-
    Halal investing means checking a stock against a long list of rules, and
    the data you need for that is scattered across a dozen sources. Tijara
    runs any equity through AAOIFI's screens — business activity, financial
    ratios, tangibility, zakah — in one pipeline.
  tech: [Next.js, TypeScript, Python, Pydantic]
  url: https://tijara-five.vercel.app
  github: https://github.com/adilmodan/tijara
  frame_url: tijara-five.vercel.app
  screenshot: /assets/work/tijara.png

