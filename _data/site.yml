# Short bio — used in <meta> and the Home "About" preview card
bio: >-
  Platform Engineer at Apple by day. The rest of the time I build products
  end to end — infrastructure to interface.

# Hero belief lines (lowercase, terse — the voice)
beliefs:
  - "i build things."
  - "products, mostly — a way to rent a home with friends, a halal stock screener, trading systems that run themselves."
  - "by day, i keep apple's kubernetes clusters from going down — the kind that can't."
  - "i think the best software gets out of your way."
  - "and that the best problems are the ones nobody builds for, because the market looks too small."

hero_footnote: "less, but better."

