  - What I do
  - Where I started
  - What I build
  - Outside of work

about:
  - >-
    I'm a Platform Engineer at <strong>Apple</strong>. I work on the
    Kubernetes infrastructure other teams build on top of, mostly making
    sure it doesn't fall over.
  - >-
    I founded <strong>Marin CoWork</strong> and ran it profitably for a few
    years, writing all the software myself: CRM, payments (~$27M/yr
    processed), analytics. Before that I got an EE degree at San Francisco
    State.
  - >-
    Right now I'm building <strong>Co-Lease</strong>, a group-first way to
    rent a place. Also shipping Tijara, and running a couple of trading bots
    on the side. I keep gravitating toward housing and markets, problems
    that feel too small or too niche for anyone else to bother with.
  - >-
    Otherwise I'm probably messing with AI agents and skills, at the mosque,
    or reading something about markets.

