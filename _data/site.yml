about:
  - >-
    I'm a Platform Engineer at <strong>Apple</strong>, keeping large-scale
    Kubernetes infrastructure alive — the kind of systems that have to stay up
    when millions of people show up at once.
  - >-
    I've always built things. I founded <strong>Marin CoWork</strong> and took
    it from zero to profitable, writing every line of software myself — CRM,
    payments ($27M+/yr), analytics. Before that, an EE degree at
    San Francisco State.
  - >-
    Products nobody else bothers with. Right now that's <strong>Co-Lease</strong>
    — a group-first way to rent — alongside Tijara and a pair of self-running
    trading systems. Markets, housing, and the infrastructure beneath them.
  - >-
    Usually in my AI lab building apps, bots, and skills — or at the mosque, or
    deep in a book about markets.

