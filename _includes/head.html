<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ site.title }} — {{ site.tagline | default: "Builder & Platform Engineer" }}</title>
<meta name="description" content="{{ site.description }}">
<meta name="theme-color" content="#FAF6F0">
<meta property="og:title" content="{{ site.title }} — {{ site.tagline | default: 'Builder & Platform Engineer' }}">
<meta property="og:description" content="{{ site.description }}">
<meta property="og:url" content="{{ site.url }}">
<meta property="og:type" content="website">
{% if site.logo %}<meta property="og:image" content="{{ site.url }}{{ site.logo }}">{% endif %}
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,400;1,9..144,600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/main.css">
